[tool.poetry]
name = "assertioncommander"
version = "0.1.0"
description = ""
authors = ["sprimbs <53371440+sprimbs@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
evaluate = "^0.4.1"
scikit-learn = "^1.3.2"
black = "^23.12.1"
urllib3 = "^1.26.12"
nltk = "^3.8.1"
tqdm = "^4.66.1"
isort = { version = "~5.13.0", extras = ["pyproject"] }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
indent = "    "

